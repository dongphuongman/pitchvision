# PitchVision model registry (AD §5 models/, §13.3: a new model = a PR changing this file, merged only if golden eval passes).
# Weights are NOT in git: they live in PITCHVISION_MODEL_DIR (default ~/.cache/pitchvision/models; R2 in deployment)
# and cv_core.registry.ModelRegistry.resolve(name) refuses a file whose sha256 differs from the entry below.
# Model cards: models/<name>.md. How to (re)build each file: the `build` command.
schema_version: 1

models:
  - name: dfine-m-obj2coco-640
    version: "2026.10.05"
    kind: detector
    file: dfine-m-obj2coco-640.onnx
    sha256: 2be1e59a3883b4f4c63fdcc8d87024229d4975f47e86e2518b6a955483446f17
    bytes: 78581067
    source: https://huggingface.co/ustc-community/dfine-medium-obj2coco
    licence: Apache-2.0 (code + weights); Objects365 pre-training data licence open in G-LEGAL
    build: uv run --project training python training/export_dfine_onnx.py   # torch 2.14.1, transformers 5.18.0, opset 17
    card: models/dfine-m-obj2coco-640.md
    input:
      pixel_values: {dtype: float32, shape: [1, 3, 640, 640], layout: NCHW, colour: RGB, scale: "1/255",
                     resize: "stretch to 640x640 (no letterbox)", normalize: none}
    output:
      logits: {dtype: float32, shape: [1, 300, 80], activation: sigmoid}
      pred_boxes: {dtype: float32, shape: [1, 300, 4], format: "cxcywh normalised 0..1"}
    postprocess: cv_core.detect.dfine.postprocess   # sigmoid → top-300 over queries×classes → xyxy px → conf
    classes: coco80                                  # person = 0, sports ball = 32
    providers: {ort_cpu: "10 fps (M4, batch 1)", ort_coreml: "24 fps (M4, MLProgram, static batch 1)"}

  - name: shots-gbm-det
    version: "1"
    kind: shot-classifier
    file: shots-gbm-det-v1.json
    sha256: b3a8df4288d14c470c6817d8325aa384351c4290327df5ee9d531ff3b3bc6207
    bytes: 119253
    source: training/train_shots.py on SP-09 labels (19 golden matches, 855 frames)
    licence: proprietary (PitchVision); training labels internal
    build: uv run --project training python training/train_shots.py --export-folds
    card: models/shots-gbm.md
    format: pv-gbm/v1                                 # cv_core.shots.gbm (pure numpy, no sklearn at runtime)
    classes: [main_wide, non_wide]                   # non_wide → ShotType.other
    requires: [dfine-m-obj2coco-640]
    eval: eval/results/shots_m1cv06_samples_det.json  # leave-one-video-out, 98.1 % accuracy

  - name: shots-gbm-colour
    version: "1"
    kind: shot-classifier
    file: shots-gbm-colour-v1.json
    sha256: 43dca81b549afa6a4103d81ef70a3d18af0c868c67fa658ea92a125aed7686b2
    bytes: 116597
    source: training/train_shots.py --no-detector on SP-09 labels
    licence: proprietary (PitchVision)
    build: uv run --project training python training/train_shots.py --no-detector
    card: models/shots-gbm.md
    format: pv-gbm/v1
    classes: [main_wide, non_wide]
    requires: []
    eval: eval/results/shots_m1cv06_samples_colour.json  # 87.5 % — below the 95 % exit criterion: fallback only

  - name: siglip-base-p16-224
    version: "2026.10.06"
    kind: embedder
    file: siglip-base-p16-224.onnx
    sha256: c18deb124a8e00ea70573c47d429e0b4cb13716a379c96625978426393747aff
    bytes: 371734454
    source: https://huggingface.co/google/siglip-base-patch16-224
    licence: Apache-2.0 (code + weights)
    build: uv run --project training python training/export_siglip_onnx.py   # vision tower only, opset 17, dynamic batch
    card: models/siglip-base-p16-224.md
    input:
      pixel_values: {dtype: float32, shape: [N, 3, 224, 224], layout: NCHW, colour: RGB, resize: "bicubic 224x224",
                     normalize: "(x/255 - 0.5) / 0.5"}
    output:
      pooler_output: {dtype: float32, shape: [N, 768]}
    preprocess: cv_core.teams.embed.preprocess
    used_by: [S3 calibrate (team model), S4 per-track team vote]
    providers: {ort_cpu: "40 ms/crop (M4, batch 32)", ort_coreml: "18 ms/crop (M4, MLProgram; ~3 min compile per load)"}

  # RESEARCH-ONLY (internal demo, PO 07/10/2026): PnLCalib weights are trained on SoccerNet (research-only data,
  # G-LEGAL) and the code is GPL-2.0 — the ONNX is built outside this repo's packages. The pitch stage loads it only
  # when PV_ENV is local/test AND PV_ALLOW_RESEARCH_MODELS=1; staging / production refuse it. Replace with the
  # licensed YOLOv11-pose fine-tune (M1-CV-05) before any customer-facing run.
  - name: pitch_keypoints
    version: "pnlcalib-sv-2024"
    kind: pitch-keypoints
    file: pitch-kp-pnlcalib-sv-540x960.onnx
    sha256: 3cc298c0e9ae7f6792b3531214d89fed42ddb6b11b4390df37c0d6dac002e5b7
    bytes: 264077536
    source: https://github.com/mguti97/PnLCalib (release v1.0.0, SV_kp)
    licence: research-only (SoccerNet-trained weights; code GPL-2.0) — NOT for customers
    research_only: true
    build: spikes/pnlcalib/.venv/bin/python spikes/pnlcalib/export_onnx.py   # see models/pitch-kp-pnlcalib-sv.md
    card: models/pitch-kp-pnlcalib-sv.md
    format: heatmap-world/v1
    threshold: 0.3434                                 # PnLCalib's keypoint threshold
    input:
      image: {dtype: float32, shape: [1, 3, 540, 960], layout: NCHW, colour: RGB, scale: "1/255", resize: stretch}
    output:
      heatmaps: {dtype: float32, shape: [1, 57, 270, 480]}
    eval: "highlight ESP–CZE (33 main_wide shots): 28 usable (h_quality >= 0.5), median 0.82; 0.3 s/frame MPS"
    # metres, template frame (57 PnLCalib keypoints, their order); null = crossbar corner (not on the ground)
    keypoints_world: [
      [0, 0], [52.5, 0], [105, 0], [0, 13.84], [16.5, 13.84], [88.5, 13.84], [105, 13.84], [0, 24.84],
      [5.5, 24.84], [99.5, 24.84], [105, 24.84], null, [0, 30.34], [105, 30.34], null, null,
      [0, 37.66], [105, 37.66], null, [0, 43.16], [5.5, 43.16], [99.5, 43.16], [105, 43.16], [0, 54.16],
      [16.5, 54.16], [88.5, 54.16], [105, 54.16], [0, 68], [52.5, 68], [105, 68], [16.5, 26.68], [52.5, 24.85],
      [88.5, 26.68], [16.5, 41.31], [52.5, 43.15], [88.5, 41.31], [19.99, 32.29], [43.68, 31.53], [61.31, 31.53], [85, 32.29],
      [19.99, 35.7], [43.68, 36.46], [61.31, 36.46], [85, 35.7], [11, 34], [16.5, 34], [20.15, 34], [46.03, 27.53],
      [58.97, 27.53], [43.35, 34], [52.5, 34], [61.5, 34], [46.03, 40.47], [58.97, 40.47], [84.85, 34], [88.5, 34],
      [94, 34]]
