# CI for the PitchVision monorepo (AD §13.3, M1-OPS-03).
#   PR:           lint, type-check, import-linter, tests, schema drift, web checks, image builds (no push)
#   push to main: same, then build + push the 3 images to GHCR tagged with the git sha
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every main commit finish so each sha gets its images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.28"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ---------------------------------------------------------------- python
  python:
    name: python (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: pitchvision
          POSTGRES_PASSWORD: pitchvision
          POSTGRES_DB: pitchvision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitchvision -d pitchvision_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PV_ENV: test
      # superuser DSN: the test fixture migrates it and grants LOGIN to pv_app (RLS role) itself
      PV_TEST_DATABASE_URL: postgresql://pitchvision:pitchvision@localhost:5432/pitchvision_test
      PV_REDIS_URL: redis://localhost:6379/0
      PV_STORAGE_ENDPOINT: http://localhost:8333
      PV_STORAGE_BUCKET: pitchvision-test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python (from .python-version)
        run: uv python install
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: ruff
        # Product code only (docs/ and spikes/ hold throwaway scripts).
        run: uv run ruff check --output-format=github packages apps workers eval
      - name: mypy
        run: >-
          uv run mypy
          packages/schemas/pitchvision_schemas
          packages/cv-core/cv_core
          apps/api/pitchvision_api
          apps/identity/pitchvision_identity
          workers/pitchvision_worker
      - name: import-linter (AD §5 dependency boundaries)
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -q
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  # ---------------------------------------------------------------- schemas
  schemas:
    name: schemas (JSON Schema export is up to date)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - name: Export --check
        run: uv run --frozen --package pitchvision-schemas python -m pitchvision_schemas.export --check

  # ---------------------------------------------------------------- web
  web:
    name: web (lint, typecheck, test, gen:check, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm -C apps/web lint
      - name: typecheck
        run: pnpm -C apps/web typecheck
      - name: test
        run: pnpm -C apps/web test --run
      - name: Generated types match packages/schemas (gen:check)
        run: pnpm -C apps/web gen:check
      - name: build
        run: pnpm -C apps/web build

  # ---------------------------------------------------------------- compose
  compose:
    name: compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml (all profiles) with .env.example
        run: |
          cp infra/compose/.env.example infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml --profile gpu-local --profile live config --quiet

  # ---------------------------------------------------------------- images
  docker:
    name: image ${{ matrix.image }}
    needs: [python, schemas, web, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pitchvision-api
            dockerfile: infra/docker/Dockerfile.api
          - image: pitchvision-worker
            dockerfile: infra/docker/Dockerfile.worker
          - image: pitchvision-web
            dockerfile: infra/docker/Dockerfile.web
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (CUDA + TensorRT worker image is ~6 GB)
        if: matrix.image == 'pitchvision-worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # full git sha = the image_tag a job records; every ComputeBackend runs that exact tag
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
