<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchVision Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f14; --s1:#10171f; --s2:#151e28; --s3:#1c2733; --ln:#202d3a; --ln2:#2b3a4a;
  --fg:#e8eef5; --fg2:#a3b3c4; --fg3:#6f8296;
  --ac:#3ddc84; --ac-ink:#052412; --info:#4da3ff; --warn:#ffb648; --dan:#ff6b6b;
  --A:#4da3ff; --B:#ff6b6b; --ref:#f2c94c; --ball:#ff8a3d;
  --sh:0 24px 64px rgba(0,0,0,.45);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --s1:#ffffff; --s2:#f7f9fb; --s3:#edf1f5; --ln:#e1e7ed; --ln2:#cfd8e1;
  --fg:#111c27; --fg2:#4a5c6e; --fg3:#7a8a9b; --ac:#0f9d58; --ac-ink:#ffffff; --info:#1a73e8; --warn:#b26a00; --dan:#d33b3b;
  --sh:0 24px 64px rgba(20,30,45,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-width:1280px;min-height:100vh}
a{color:inherit;text-decoration:none}
[data-go],[data-toggle],[data-toast],[data-chip],[data-scroll],[data-theme-toggle]{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg3)} .fg2{color:var(--fg2)}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1} .rel{position:relative}
.ic{flex:none;display:block}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}

/* buttons */
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--ln2);background:var(--s2);color:var(--fg);font:600 13.5px var(--font);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--s3);color:var(--fg)}
.btn.danger{background:transparent;color:var(--dan);border-color:color-mix(in srgb,var(--dan) 40%,transparent)}
.btn.danger.solid{background:var(--dan);color:#fff;border-color:transparent}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.lg{height:44px;padding:0 20px;font-size:15px;border-radius:10px}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{color:var(--ac);font-weight:600}
.lnk:hover{text-decoration:underline}
.iconbtn{position:relative;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--fg2);display:grid;place-items:center}
.iconbtn:hover{background:var(--s3);color:var(--fg)}
.iconbtn .dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--dan);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* form */
.field{display:grid;gap:6px} .field>label{font-size:12.5px;color:var(--fg2);font-weight:600}
.input{height:38px;border:1px solid var(--ln2);background:var(--bg);border-radius:8px;padding:0 12px;color:var(--fg);font:14px var(--font);width:100%;display:flex;align-items:center;gap:8px}
.input.focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.input .ph{color:var(--fg3)}
.input.err{border-color:var(--dan)}
.help{font-size:12.5px;color:var(--fg3)} .help.err{color:var(--dan)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--fg2)}
.box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ln2);display:grid;place-items:center;margin-top:1px}
.box.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.rad{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ln2);margin-top:1px;display:grid;place-items:center}
.rad.on{border-color:var(--ac)} .rad.on::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ac)}
.tgl{flex:none;width:36px;height:20px;border-radius:10px;background:var(--ln2);position:relative}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--ac)} .tgl.on::after{left:18px}
.seg{display:inline-flex;background:var(--s3);border-radius:9px;padding:3px;gap:2px}
.seg a{padding:5px 12px;border-radius:7px;color:var(--fg2);font-size:13px;font-weight:600}
.seg a.on{background:var(--s1);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.slider{height:4px;border-radius:2px;background:var(--ln2);position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:2px}
.slider b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ac);transform:translate(-50%,-50%)}
.rcard{border:1.5px solid var(--ln2);border-radius:12px;padding:16px;display:flex;gap:12px;background:var(--s2)}
.rcard.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--s2))}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.b-run{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.b-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b-err{color:var(--dan);background:color-mix(in srgb,var(--dan) 14%,transparent)}
.b-mute{color:var(--fg2);background:var(--s3)}
.b-pro{color:#c49bff;background:rgba(176,124,255,.15);font-size:10.5px;padding:2px 7px;letter-spacing:.04em}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--dan);box-shadow:0 0 0 0 rgba(255,107,107,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px}
.card.p{padding:18px 20px}
.ct{font-size:13px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid;font-size:13.5px}
.banner.warn{background:color-mix(in srgb,var(--warn) 9%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.warn .bi{color:var(--warn)}
.banner.info{background:color-mix(in srgb,var(--info) 9%,transparent);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.banner.info .bi{color:var(--info)}
.banner.err{background:color-mix(in srgb,var(--dan) 9%,transparent);border-color:color-mix(in srgb,var(--dan) 30%,transparent)}
.banner.err .bi{color:var(--dan)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln)}
.tabs a{padding:11px 14px;color:var(--fg2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--fg)} .tabs a.on{color:var(--fg);border-color:var(--ac)}
.tabs .soon{font-size:10.5px;color:var(--fg3);border:1px solid var(--ln2);padding:0 6px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;color:var(--fg3);font-weight:650;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--ln);font-size:13.5px;vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--s2)}
.tbl tr.sel td{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--ln2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg2);background:var(--s2)}
hr.d{border:0;border-top:1px solid var(--ln);margin:16px 0}

/* menus */
.menu{position:absolute;display:none;background:var(--s1);border:1px solid var(--ln2);border-radius:12px;padding:6px;min-width:220px;box-shadow:var(--sh);z-index:70}
.menu.open{display:block}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--fg)}
.menu a:hover{background:var(--s3)}
.menu a.dn{color:var(--dan)}
.menu a .k{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--ln);margin:6px 2px}
.menu .mh{padding:8px 10px 6px;font-size:12px;color:var(--fg3)}

/* topbar */
.tb{height:58px;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--ln);background:var(--s1);position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.logo i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3ddc84,#1b8f52);position:relative}
.logo i::after{content:"";position:absolute;inset:6px;border:2px solid #04210f;border-radius:50%}
.logo.lg{font-size:20px} .logo.lg i{width:30px;height:30px}
.nav{display:flex;gap:2px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--fg2);font-weight:600;display:flex;gap:7px;align-items:center}
.nav a:hover{color:var(--fg);background:var(--s3)} .nav a.on{color:var(--fg);background:var(--s3)}
.nav .cnt{font-size:11px;background:var(--info);color:#04121f;border-radius:8px;padding:0 6px;font-weight:700}
.meter{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);font-weight:600;padding:4px 8px;border-radius:8px}
.meter:hover{background:var(--s3)}
.meter i{display:block;width:96px;height:4px;border-radius:2px;background:var(--ln2);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ac)}
.avatar{width:32px;height:32px;border-radius:50%;border:0;background:linear-gradient(135deg,#4da3ff,#7c5cff);color:#fff;font-weight:700;font-size:12px}

/* page */
.page{padding:26px 32px 60px;max-width:1400px;margin:0 auto}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ph h1{font-size:24px;font-weight:750}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font-weight:600;font-size:13.5px}
.back:hover{color:var(--fg)}

/* modal / drawer / toast */
.mbg{position:fixed;inset:0;background:rgba(3,7,11,.62);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:24px}
:root[data-theme="light"] .mbg{background:rgba(20,30,45,.38)}
.modal{background:var(--s1);border:1px solid var(--ln);border-radius:16px;width:660px;max-height:calc(100vh - 48px);overflow:auto;box-shadow:var(--sh)}
.modal.sm{width:480px} .modal.lg{width:920px}
.mhd{padding:18px 22px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:12px}
.mhd h3{font-size:17px;font-weight:700}
.mbd{padding:20px 22px}
.mft{padding:14px 22px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.drawer{position:fixed;right:0;top:58px;bottom:0;width:400px;background:var(--s1);border-left:1px solid var(--ln);z-index:60;box-shadow:var(--sh);overflow:auto}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;z-index:200;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .t{background:#1d2834;color:#e8eef5;border:1px solid #2b3a4a;padding:11px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);font-size:13.5px}

/* visuals */
svg.frame{display:block;width:100%;height:100%}
svg.frame .pl[data-go]:hover rect.bb{stroke-width:3}
svg.tmap{display:block;width:100%;height:100%}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:12px 12px 0 0;background:#1d4f28}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(5,9,13,.78);color:#fff;font:600 11.5px var(--mono);padding:2px 6px;border-radius:5px}
.thumb .st{position:absolute;left:8px;top:8px}
.thumb .st .badge{backdrop-filter:blur(6px);background:rgba(5,9,13,.72)}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.4)} .thumb .prog i{display:block;height:100%;background:var(--info)}

/* landing */
.lp-h{height:68px;display:flex;align-items:center;gap:28px;padding:0 48px;border-bottom:1px solid var(--ln)}
.lp-h nav{display:flex;gap:22px;color:var(--fg2);font-weight:600}
.lp-h nav a:hover{color:var(--fg)}
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:56px;align-items:center;padding:72px 48px 56px;max-width:1440px;margin:0 auto}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.hero h1{font-size:54px;line-height:1.04;letter-spacing:-.035em;margin:14px 0 18px;font-weight:800}
.hero p{font-size:17.5px;color:var(--fg2);max-width:52ch;margin:0 0 28px}
.hero-n{margin-top:18px;color:var(--fg3);font-size:13px}
.hero-v{display:grid;grid-template-columns:1fr 210px;gap:12px;background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.hv-frame{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden}
.hv-map{background:#fff;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.hv-map .cap{color:#111;font-weight:700;font-size:13px;text-align:center;margin-bottom:6px}
.vhud{position:absolute;left:10px;top:8px;font:700 12px var(--mono);color:#fff;background:rgba(5,9,13,.6);padding:3px 7px;border-radius:5px}
.feat{max-width:1440px;margin:0 auto;padding:24px 48px 64px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat .card{padding:22px} .feat h3{font-size:16px;margin:12px 0 6px} .feat p{margin:0;color:var(--fg2);font-size:13.5px}
.fi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.pricing{max-width:1100px;margin:0 auto;padding:16px 48px 80px}
.pricing h2{font-size:32px;text-align:center;margin-bottom:28px;letter-spacing:-.02em}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{padding:24px;display:flex;flex-direction:column;gap:12px}
.plan.hl{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.plan .pr{font-size:34px;font-weight:800;letter-spacing:-.02em} .plan .pr small{font-size:14px;color:var(--fg3);font-weight:500}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--fg2);font-size:13.5px}
.plan li{display:flex;gap:8px;align-items:center} .plan li .ic{color:var(--ac)}
.lp-f{border-top:1px solid var(--ln);padding:24px 48px;display:flex;gap:22px;color:var(--fg3);font-size:13px}
.lp-f a:hover{color:var(--fg)}

/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.auth-art{position:relative;overflow:hidden;background:#1d4f28}
.auth-art svg{position:absolute;inset:0;width:100%;height:100%}
.auth-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.2),rgba(6,10,14,.85))}
.auth-q{position:absolute;left:48px;right:48px;bottom:48px;z-index:2;color:#fff}
.auth-q h2{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:18px 0 8px;font-weight:800}
.auth-q p{color:rgba(255,255,255,.75);margin:0;font-size:15px}
.auth-form{display:grid;place-items:center;padding:40px;background:var(--bg)}
.af{width:400px;display:flex;flex-direction:column;gap:16px}
.af h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
.af .sub{color:var(--fg2);margin:-8px 0 4px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg3);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.gbtn{justify-content:center;height:42px;width:100%}
.center{min-height:100vh;display:grid;place-items:center;padding:40px}
.steps{display:flex;gap:8px;align-items:center;color:var(--fg3);font-size:12.5px;font-weight:600}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--ln2)} .steps i.on{background:var(--ac)}
.strength{display:flex;gap:4px} .strength i{flex:1;height:4px;border-radius:2px;background:var(--ln2)} .strength i.on{background:var(--ac)}

/* library */
.filters{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.vcard{background:var(--s1);border:1px solid var(--ln);border-radius:12px;transition:border-color .12s,transform .12s}
.vcard:hover{border-color:var(--ln2);transform:translateY(-1px)}
.vcard .vb{padding:12px 14px 14px;display:flex;gap:8px}
.vcard h4{font-size:14.5px;font-weight:650;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .m{font-size:12.5px;color:var(--fg3)}
.empty{display:grid;place-items:center;text-align:center;padding:90px 20px;border:1.5px dashed var(--ln2);border-radius:18px;background:var(--s1)}
.empty h2{font-size:22px;margin:18px 0 6px} .empty p{color:var(--fg2);margin:0 0 22px}

/* new analysis */
.drop{border:1.5px dashed var(--ln2);border-radius:14px;padding:28px;text-align:center;background:var(--s2);color:var(--fg2)}
.drop .ic{margin:0 auto 10px;color:var(--ac)}
.file{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s2)}
.file .fic{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info);display:grid;place-items:center}
.sumline{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--s2);font-size:13.5px;color:var(--fg2)}
.pbar{height:8px;border-radius:4px;background:var(--ln2);overflow:hidden} .pbar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.pbar.info i{background:var(--info)}

/* processing */
.stepper{display:flex;align-items:center;gap:10px;margin:6px 0 26px}
.stepper .s{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg3);font-size:13.5px}
.stepper .s .c{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ln2);display:grid;place-items:center;font-size:12px}
.stepper .s.done{color:var(--fg2)} .stepper .s.done .c{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.stepper .s.now{color:var(--fg)} .stepper .s.now .c{border-color:var(--info);color:var(--info)}
.stepper .s.fail{color:var(--dan)} .stepper .s.fail .c{border-color:var(--dan);background:var(--dan);color:#fff}
.stepper .ln{flex:1;height:2px;background:var(--ln2)} .stepper .ln.done{background:var(--ac)}
.big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.mosaic{display:grid;grid-template-columns:repeat(45,1fr);gap:3px}
.mosaic i{aspect-ratio:1;border-radius:3px;background:var(--ln2)}
.mosaic i.d{background:var(--ac)} .mosaic i.r{background:var(--info);animation:blink 1.2s infinite} .mosaic i.f{background:var(--dan)}
@keyframes blink{50%{opacity:.45}}

/* teams */
.crops{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.crop{aspect-ratio:3/5;border-radius:8px;overflow:hidden;background:#2a6a34;border:1px solid rgba(255,255,255,.06)}
.crop svg{width:100%;height:100%;display:block}
.sw{display:flex;gap:8px}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--s1)}
.sw i.on{border-color:var(--fg)}
.sw i.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}

/* workspace */
.ws{padding:16px 20px 60px;max-width:1600px;margin:0 auto}
.ws-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.crumb{display:flex;align-items:center;gap:10px;font-size:15px}
.crumb a{color:var(--fg2);font-weight:600} .crumb a:hover{color:var(--fg)} .crumb b{font-weight:700;font-size:17px}
.ws-main{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-top:12px}
.vid{background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--ln)}
.vwrap{position:relative;aspect-ratio:16/9}
.vwrap .vhud{left:12px;top:10px}
.ctrl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--s1);border-top:1px solid var(--ln)}
.ctrl .btn.icon{background:transparent;border-color:transparent}
.ctrl .btn.icon:hover{background:var(--s3)}
.tl{flex:1;position:relative;height:30px}
.tl .bar{position:absolute;left:0;right:0;top:13px;height:5px;border-radius:3px;background:var(--ln2)}
.tl .played{position:absolute;left:0;top:13px;height:5px;border-radius:3px;background:var(--ac)}
.tl .low{position:absolute;top:11px;height:9px;border-radius:2px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 70%,transparent) 0 3px,transparent 3px 6px)}
.tl .sel{position:absolute;top:6px;height:19px;border-radius:4px;background:color-mix(in srgb,var(--info) 20%,transparent);border:1px solid var(--info)}
.tl .knob{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tl .shot{position:absolute;top:12px;height:7px;background:var(--fg3);opacity:.75;border-radius:1px}
.tl .mk{position:absolute;top:0;width:2px;height:8px;background:var(--fg2);border-radius:1px}
.layers{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--s1);border-top:1px solid var(--ln);flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--ln2);background:transparent;color:var(--fg3);font:600 12.5px var(--font);display:inline-flex;align-items:center;gap:6px}
.chip.on{color:var(--fg);background:var(--s3);border-color:var(--ln2)}
.chip.on::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ac)}
.chip .b-pro{margin-left:2px}
.mapp{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mapp .mapbox{flex:1;min-height:0;display:grid;place-items:center}
.legend{display:flex;gap:12px;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.tabc{padding-top:18px}
.statrow{display:grid;grid-template-columns:110px 1fr 1fr 110px;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.statrow:last-child{border-bottom:0}
.statrow .k{grid-column:2/4;text-align:center;font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:-6px}
.statrow .v{font:700 16px var(--mono)} .statrow .v.r{text-align:right}
.dual{grid-column:2/4;display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.dual i:first-child{background:var(--A)} .dual i:last-child{background:var(--B)}
.tdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tsq{width:10px;height:10px;border-radius:2px;display:inline-block}
.ctxm{position:absolute;z-index:20;display:block}
.ctxm .menu{position:static;display:block}
.cite{display:inline-flex;align-items:center;font:600 11px var(--mono);color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);padding:0 5px;border-radius:4px;margin:0 2px;vertical-align:1px}
.cite.on{outline:1.5px solid var(--ac)}
.pop{position:absolute;z-index:40;width:300px;background:var(--s1);border:1px solid var(--ln2);border-radius:12px;box-shadow:var(--sh);padding:14px}

/* settings */
.set{display:grid;grid-template-columns:230px 1fr;gap:32px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--fg2);font-weight:600}
.snav a:hover{background:var(--s3);color:var(--fg)} .snav a.on{background:var(--s3);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:18px;max-width:760px}
.sec h2{font-size:20px;font-weight:750}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* live */
.livebar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--s1);border-bottom:1px solid var(--ln)}
.lv{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px 20px}
.lbadge{display:inline-flex;align-items:center;gap:8px;background:var(--dan);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:6px}
.metric{display:flex;flex-direction:column;font-size:11.5px;color:var(--fg3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric b{font:700 15px var(--mono);color:var(--fg);text-transform:none;letter-spacing:0}

/* proto toolbar */
.proto{position:fixed;left:16px;bottom:16px;z-index:300;display:flex;align-items:center;gap:8px;background:rgba(10,14,19,.94);border:1px solid #2b3a4a;border-radius:14px;padding:8px 10px;box-shadow:0 12px 40px rgba(0,0,0,.5);color:#e8eef5;font:13px var(--font);backdrop-filter:blur(8px)}
.proto .id{font:700 12px var(--mono);color:#3ddc84;padding:0 6px;min-width:120px}
.proto select{height:30px;background:#151e28;color:#e8eef5;border:1px solid #2b3a4a;border-radius:8px;padding:0 8px;font:13px var(--font);max-width:260px}
.proto button,.proto a{height:30px;padding:0 10px;border-radius:8px;border:1px solid #2b3a4a;background:#151e28;color:#e8eef5;font:600 12.5px var(--font);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.proto button.on{border-color:#ffb648;color:#ffb648}
.proto .sepv{width:1px;height:20px;background:#2b3a4a}
body.hot #app [data-go],body.hot #ov [data-go],body.hot [data-toggle],body.hot [data-toast]{outline:2px dashed #ffb648!important;outline-offset:2px}
</style>
</head>

const sampleSeg=(x0,y0,x1,y1,n=14)=>Array.from({length:n+1},(_,i)=>[x0+(x1-x0)*i/n,y0+(y1-y0)*i/n]);

function figure(p,m,o){

/* ================= tactical map ================= */
function tmap(o={}){
  o={vertical:1,light:0,num:0,trail:0,shape:0,ball:1,...o};
  const tr=o.vertical?(x,y)=>[y,105-x]:(x,y)=>[x,y];
  const W=o.vertical?68:105,H=o.vertical?105:68;
  const fill=o.light?'#ffffff':'#13432a',line=o.light?'#111':'rgba(255,255,255,.7)';
  let s=`<svg class="tmap" viewBox="-4 -4 ${W+8} ${H+8}" preserveAspectRatio="xMidYMid meet">`;
  s+=`<rect x="-4" y="-4" width="${W+8}" height="${H+8}" rx="2" fill="${fill}"/>`;
  if(!o.light)for(let i=0;i<10;i++){const a=i*10.5;s+=o.vertical?`<rect x="0" y="${a}" width="68" height="10.5" fill="${i%2?'#154a2e':'#13432a'}"/>`:`<rect x="${a}" y="0" width="10.5" height="68" fill="${i%2?'#154a2e':'#13432a'}"/>`;}
  s+=pitchLines(tr,`fill="none" stroke="${line}" stroke-width="${o.light?.45:.35}"`);
  if(o.extra)s+=o.extra(tr);
  if(o.shape){for(const t of ['A','B']){const pts=hull(PL.filter(p=>p.t===t&&!p.gk).map(p=>tr(p.x,p.y)));s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${TEAMS[t].c}" fill-opacity=".12" stroke="${TEAMS[t].c}" stroke-width=".35" stroke-dasharray="1 .8"/>`;}}
  for(const p of PL){const [X,Y]=tr(p.x,p.y);const T=TEAMS[p.t];const c=o.light?(p.t==='A'?'#111':p.t==='B'?'#fff':'#f2c94c'):T.c;const st=o.light?'#111':'#fff';const sel=o.sel==p.id;
    if(o.trail&&p.t!=='R'){const dx=(rnd(p.id)-.5)*6,dy=(rnd(p.id*2)-.3)*6;const [a,b]=tr(p.x-dx,p.y-dy);s+=`<path d="M${a} ${b}Q${(a+X)/2+1} ${(b+Y)/2} ${X} ${Y}" fill="none" stroke="${T.c}" stroke-width=".5" opacity=".55"/>`;}
    const go=o.click&&p.t!=='R'?`data-go="${o.click(p)}"`:'';
    s+=`<g ${go}>`;
    if(sel)s+=`<circle cx="${X}" cy="${Y}" r="3.4" fill="none" stroke="#3ddc84" stroke-width=".6"/>`;
    if(p.t==='A')s+=`<circle cx="${X}" cy="${Y}" r="1.8" fill="${c}" stroke="${st}" stroke-width=".35"/>`;
    else if(p.t==='B')s+=`<rect x="${X-1.6}" y="${Y-1.6}" width="3.2" height="3.2" rx=".3" fill="${c}" stroke="${o.light?'#111':'#fff'}" stroke-width=".35"/>`;
    else s+=`<path d="M${X} ${Y-2}L${X+1.9} ${Y+1.4}H${X-1.9}Z" fill="#f2c94c" stroke="${st}" stroke-width=".3"/>`;
    if(o.num&&p.t!=='R')s+=`<text x="${X}" y="${Y+.75}" text-anchor="middle" font-size="1.9" font-weight="700" font-family="Inter" fill="${p.t==='A'?'#04121f':'#2a0505'}">${p.n}</text>`;
    s+='</g>';}
  if(o.ball){const [X,Y]=tr(BALL.x,BALL.y);s+=`<circle cx="${X}" cy="${Y}" r="1" fill="#ff8a3d" stroke="#fff" stroke-width=".3"/>`;}

}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}

}

<div class="row" style="gap:16px">${L('Privacy policy','scr-53')}${L('Data processing agreement','scr-53')}</div>`;

'403':['403',"You don't have access to this match.",'It belongs to an organization you are not a member of.',B('Request access','','primary',T('Access requested — the owner was notified'))+B('Switch organization','','',T('Choose an organization'))+B('Go to library','scr-10','ghost')],

R['dlg-01']=()=>DLG(R['scr-10']().html,'Delete “France vs Switzerland”?',`<p class="fg2" style="margin:0">The video, analysis, exports and share links will be removed. You can undo for 10 seconds.</p>`,`<div class="sp"></div>${B('Cancel','scr-10','ghost')}${B(ic('trash')+'Delete','scr-10','danger solid',T('Deleted — Undo'))}`,'scr-10');

R['dlg-06']=()=>DLG(R['scr-40']('members').html,'Invite members',`${field('Emails',`<div class="input focus" style="height:auto;min-height:70px;align-items:flex-start;padding:8px 10px;flex-wrap:wrap;gap:6px"><span class="badge b-mute">jordan@riversidefc.com ×</span><span class="badge b-mute">coach2@riversidefc.com ×</span></div>`,'Separate with commas')}<div style="margin-top:14px">${field('Role',`<div class="input">Editor — can analyze, edit and share<div class="sp"></div>${ic('chev')}</div>`)}</div>`,`<span class="muted" style="font-size:12.5px">1 seat left</span><div class="sp"></div>${B('Cancel','scr-40/members','ghost')}${B('Send invites','scr-40/members','primary',T('2 invites sent'))}`,'scr-40/members');
R['dlg-07']=()=>DLG(R['scr-40']('api-keys').html,'API key created',`<div class="banner warn" style="margin-bottom:14px"><span class="bi">${ic('alert')}</span><span>Copy this key now — you won't see it again.</span></div><div class="row"><div class="input mono" style="font-size:12.5px">pv_live_7Hq2…xA91kD3f9f2c</div>${B(ic('copy')+'Copy','','',T('Copied'))}</div>`,`<div class="sp"></div>${B("I've saved it",'scr-40/api-keys','primary')}`,'scr-40/api-keys');
R['dlg-08']=()=>DLG(R['scr-40']('privacy').html,'Delete Riverside FC Academy?',`<p class="fg2" style="margin:0 0 14px">This permanently deletes <b style="color:var(--fg)">8 matches</b>, all exports, reports and share links within 24 hours. Members lose access immediately.</p>${field('Type the organization name to confirm',inp('Riverside FC Academy',0,'focus'))}`,`<div class="sp"></div>${B('Cancel','scr-40/privacy','ghost')}${B('Delete permanently','scr-01','danger solid',T('Organization scheduled for deletion'))}`,'scr-40/privacy');
R['dlg-09']=()=>DLG(R['scr-21']().html,'Paste lineup',`${field('Team',`<div class="input"><span class="tdot" style="background:var(--A)"></span>France<div class="sp"></div>${ic('chev')}</div>`)}<div style="margin-top:14px">${field('One player per line',`<div class="input mono focus" style="height:auto;flex-direction:column;align-items:flex-start;padding:10px 12px;font-size:12.5px;line-height:1.7">1 T. Morel<br>2 L. Duval<br>4 R. Kessler<br>9 O. Petit<br>10 K. Martin</div>`,'Matched by jersey number: <b style="color:var(--ac)">5 of 5</b>')}</div>`,`<div class="sp"></div>${B('Cancel','scr-21','ghost')}${B('Apply','scr-21','primary',T('5 players matched — review and save'))}`,'scr-21');
R['dlg-10']=()=>DLG(R['scr-31']().html,'End live session?',`<p class="fg2" style="margin:0">The session ends for all 3 viewers. The recording (42 min) is saved.</p>`,`<div class="sp"></div>${B('Keep live','scr-31','ghost')}${B(ic('stop')+'End session','scr-32','danger solid')}`,'scr-31');

/* ================= screen index ================= */
const GROUPS=[
['A · Public & Auth',[['scr-01','SCR-01 Landing'],['scr-02','SCR-02 Sign in'],['scr-03','SCR-03 Sign up'],['scr-04','SCR-04 Forgot password'],['scr-04/sent','SCR-04 · link sent'],['scr-05','SCR-05 Reset password'],['scr-05/expired','SCR-05 · expired'],['scr-06','SCR-06 Verify email'],['scr-07/1','SCR-07 Onboarding · 1 Org'],['scr-07/2','SCR-07 Onboarding · 2 Region'],['scr-07/3','SCR-07 Onboarding · 3 Prefs'],['scr-52','SCR-52 Accept invite'],['scr-53','SCR-53 Legal']]],
['B · Library & New analysis',[['scr-10','SCR-10 Library'],['scr-10/empty','SCR-10 · empty'],['scr-11','SCR-11 New · Upload'],['scr-11/uploading','SCR-11 · Uploading'],['scr-11/youtube','SCR-11 · YouTube'],['scr-11/live','SCR-11 · Live'],['scr-11/import','SCR-11 · Import'],['scr-12','SCR-12 Advanced settings'],['scr-12/reanalyze','SCR-12 · Re-analyze']]],
['C · Processing',[['scr-13','SCR-13 Processing'],['scr-13/error','SCR-13 · Error'],['scr-14','SCR-14 Confirm teams'],['scr-14/manual','SCR-14 · Manual pick'],['scr-15','SCR-15 Calibrate pitch']]],
['D · Workspace',[['scr-20/overview','SCR-20a Overview'],['scr-20/overview:replay','SCR-20 · During replay'],['scr-20/players','SCR-20b Players'],['scr-20/heatmaps','SCR-20c Heatmaps'],['scr-20/passing','SCR-20d Passing'],['scr-20/tactics','SCR-20e Tactics'],['scr-20/data','SCR-20f Data'],['scr-21','SCR-21 Roster'],['scr-22/21','SCR-22 Correction menu'],['scr-23/11','SCR-23 Player drawer']]],
['E · Report, Export, Share',[['scr-24','SCR-24 AI report'],['scr-24/empty','SCR-24 · not generated'],['scr-24/generating','SCR-24 · generating'],['scr-25','SCR-25 Export · video'],['scr-25/data','SCR-25 · data'],['scr-25/pdf','SCR-25 · PDF'],['scr-26','SCR-26 Exports'],['scr-27','SCR-27 Share'],['scr-28','SCR-28 Shared viewer']]],
['F · Live — Phase C (hoãn)',[['scr-30','SCR-30 Live hub'],['scr-30/add','SCR-30 · Add source'],['scr-31','SCR-31 Live viewer'],['scr-31/reconnect','SCR-31 · Reconnecting'],['scr-32','SCR-32 Live summary']]],
['G · Settings',[['scr-40/profile','SCR-40 Profile'],['scr-40/organization','SCR-40 Organization'],['scr-40/members','SCR-40 Members'],['scr-40/billing','SCR-40 Billing'],['scr-40/api-keys','SCR-40 API keys'],['scr-40/preferences','SCR-40 Preferences'],['scr-40/privacy','SCR-40 Data & privacy'],['scr-41','SCR-41 Upgrade']]],
['H · System & Dialogs',[['scr-50/404','SCR-50 · 404'],['scr-50/403','SCR-50 · 403'],['scr-50/410','SCR-50 · 410'],['scr-50/500','SCR-50 · 500'],['scr-50/region','SCR-50 · Wrong region'],['scr-51','SCR-51 Notifications'],['dlg-01','DLG-01 Delete'],['dlg-02','DLG-02 Cancel analysis'],['dlg-03','DLG-03 Unsaved changes'],['dlg-04','DLG-04 Rename'],['dlg-05','DLG-05 Shortcuts'],['dlg-06','DLG-06 Invite'],['dlg-07','DLG-07 API key'],['dlg-08','DLG-08 Delete org'],['dlg-09','DLG-09 Paste lineup'],['dlg-10','DLG-10 End live']]]];
const FLAT=GROUPS.flatMap(g=>g[1]);
const SPEC=(h)=>{const [id,st]=h.split('/');if(id==='scr-20'){const m={overview:'a',players:'b',heatmaps:'c',passing:'d',tactics:'e',data:'f'};return '#scr-20'+(m[(st||'overview').split(':')[0]]||'')}return '#'+id};

/* ================= router & interactions ================= */
const app=document.getElementById('app'),ov=document.getElementById('ov'),toastEl=document.getElementById('toast');
const pSel=document.getElementById('pSel');
pSel.innerHTML=GROUPS.map(([g,items])=>`<optgroup label="${g}">${items.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</optgroup>`).join('');
let lastBase='';
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||'scr-01';
  const [id,...rest]=h.split('/');const st=rest.join('/');
  const f=R[id];let out;
  try{out=f?f(st):R['scr-50']('404')}catch(e){console.error(e);out={html:`<pre style="padding:40px;color:#ff6b6b">${e.stack}</pre>`}}
  app.innerHTML=out.html||'';ov.innerHTML=out.ov||'';
  const baseKey=id+(out.ov?'':'/'+st);
  if(!out.ov&&baseKey!==lastBase)window.scrollTo(0,0);
  lastBase=out.ov?lastBase:baseKey;
  document.getElementById('pId').textContent=h;
  const opt=FLAT.find(x=>x[0]===h)||FLAT.find(x=>x[0].split('/')[0]===id);
  if(opt)pSel.value=opt[0];
  document.getElementById('pSpec').href='../UIUX.html'+SPEC(h);
  document.title='PitchVision · '+(opt?opt[1]:h);
}
function go(r){if(location.hash.slice(1)===r)render();else location.hash=r}
let tt;function toast(t){toastEl.innerHTML=`<div class="t">${t.replace(/ — Undo$/,'')}${/— Undo$/.test(t)?`<a class="lnk" style="display:flex;gap:6px;align-items:center">${ic('undo',14)}Undo</a>`:''}</div>`;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),3200)}
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  document.querySelectorAll('.menu.open').forEach(m=>{if(!tg||m.id!==tg.dataset.toggle)if(!m.contains(e.target))m.classList.remove('open')});
  document.querySelectorAll('.pop').forEach(p=>{if(!e.target.closest('.pop')&&!(tg&&tg.dataset.toggle===p.id))p.style.display='none'});
  if(tg){const m=document.getElementById(tg.dataset.toggle);if(m){if(m.classList.contains('pop'))m.style.display=m.style.display==='none'?'block':'none';else m.classList.toggle('open')}e.stopPropagation();return}
  const th=e.target.closest('[data-theme-toggle]');if(th){toggleTheme();return}
  const sc=e.target.closest('[data-scroll]');if(sc){document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
  const bg=e.target.closest('.mbg');if(bg&&!e.target.closest('[data-stop]')){go(bg.dataset.go);return}
  const ch=e.target.closest('[data-chip]');
  const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast);
  const g=e.target.closest('[data-go]');
  if(g&&g.dataset.go&&!(bg&&g===bg)){go(g.dataset.go);return}
  if(ch&&!t){if(ch.classList.contains('chk')){const b=ch.querySelector('.box');b.classList.toggle('on');b.innerHTML=b.classList.contains('on')?ic('check',12,3):''}
    else if(ch.classList.contains('rcard')){ch.parentElement.querySelectorAll('.rcard').forEach(r=>{r.classList.remove('on');r.querySelector('.rad')?.classList.remove('on')});ch.classList.add('on');ch.querySelector('.rad')?.classList.add('on')}
    else if(ch.parentElement.classList.contains('seg')){ch.parentElement.querySelectorAll('a').forEach(a=>a.classList.remove('on'));ch.classList.add('on')}
    else if(ch.parentElement.classList.contains('sw')){ch.parentElement.querySelectorAll('i').forEach(a=>a.classList.remove('on'));ch.classList.add('on')}
    else if(ch.classList.contains('tgl'))ch.classList.toggle('on');
    else if(ch.tagName==='LABEL'&&ch.querySelector('.tgl'))ch.querySelector('.tgl').classList.toggle('on');
    else ch.classList.toggle('on')}
});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-ctx]');if(t&&t.dataset.ctx){e.preventDefault();go(t.dataset.ctx)}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(e.key==='Escape'){const c=ov.querySelector('.mbg');if(c)go(c.dataset.go);else if(location.hash.startsWith('#scr-23')||location.hash.startsWith('#scr-22'))go('scr-20/overview')}
  if(e.key==='?'&&!e.metaKey)go('dlg-05');
  if(location.hash.startsWith('#scr-20')&&/^[1-6]$/.test(e.key))go('scr-20/'+TABS[+e.key-1][0]);
  if(e.key==='ArrowRight'&&e.altKey)step(1);if(e.key==='ArrowLeft'&&e.altKey)step(-1)});
function step(d){const h=location.hash.slice(1)||'scr-01';let i=FLAT.findIndex(x=>x[0]===h);if(i<0)i=FLAT.findIndex(x=>x[0].split('/')[0]===h.split('/')[0]);go(FLAT[(i+d+FLAT.length)%FLAT.length][0])}
function toggleTheme(){const r=document.documentElement;const n=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',n);try{localStorage.setItem('pvp-theme',n)}catch(e){}}
try{const t=localStorage.getItem('pvp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
pSel.onchange=()=>go(pSel.value);
document.getElementById('pPrev').onclick=()=>step(-1);
document.getElementById('pNext').onclick=()=>step(1);
document.getElementById('pBack').onclick=()=>history.back();
document.getElementById('pHot').onclick=e=>{document.body.classList.toggle('hot');e.currentTarget.classList.toggle('on')};
document.getElementById('pTheme').onclick=toggleTheme;
window.addEventListener('hashchange',render);
render();
</script>
