[project]
name = "pitchvision"
version = "0.1.0"
description = "PitchVision AI monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/schemas", "packages/cv-core", "apps/api", "apps/identity", "workers"]

[tool.uv.sources]
pitchvision-schemas = { workspace = true }
cv-core = { workspace = true }
pitchvision-api = { workspace = true }
pitchvision-identity = { workspace = true }
pitchvision-worker = { workspace = true }

[dependency-groups]
dev = [
  "pitchvision-schemas",
  "cv-core",
  "pitchvision-api",
  "pitchvision-identity",
  "pitchvision-worker",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text in comments/docstrings

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["spikes/", "data/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/schemas/tests", "packages/cv-core/tests", "apps/api/tests", "apps/identity/tests", "workers/tests", "eval/tests", "training/keypoints"]

# AD §5 dependency boundaries — enforced in CI (M1-BE-01)
[tool.importlinter]
root_packages = ["pitchvision_schemas", "cv_core", "pitchvision_api", "pitchvision_identity", "pitchvision_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "schemas is a leaf: depends on nothing in the repo"
type = "forbidden"
source_modules = ["pitchvision_schemas"]
forbidden_modules = ["cv_core", "pitchvision_api", "pitchvision_worker"]

[[tool.importlinter.contracts]]
name = "cv-core is pure CV: no web, queue or worker code"
type = "forbidden"
source_modules = ["cv_core"]
forbidden_modules = ["pitchvision_api", "pitchvision_worker", "fastapi", "celery", "sqlalchemy", "redis"]

[[tool.importlinter.contracts]]
name = "api never imports cv-core or workers (keeps CUDA out of the API image)"
type = "forbidden"
source_modules = ["pitchvision_api"]
forbidden_modules = ["cv_core", "pitchvision_worker"]

[[tool.importlinter.contracts]]
name = "identity is a separate service: no api, cv-core or worker imports"
type = "forbidden"
source_modules = ["pitchvision_identity"]
forbidden_modules = ["pitchvision_api", "cv_core", "pitchvision_worker"]
