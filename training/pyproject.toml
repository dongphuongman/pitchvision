[project]
name = "pitchvision-training"
version = "0.1.0"
description = "Offline training / export scripts. NOT a uv workspace member: torch & co never become cv-core runtime deps."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cv-core",
  "pitchvision-schemas",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.19",
  "onnx>=1.17",
  "onnxscript>=0.2",
  "scikit-learn>=1.5",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.50",
  "pillow>=10",
  "pyyaml>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
cv-core = { path = "../packages/cv-core", editable = true }
pitchvision-schemas = { path = "../packages/schemas", editable = true }
