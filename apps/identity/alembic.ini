# identity database: PV_IDENTITY_MIGRATE_DATABASE_URL, falling back to PV_IDENTITY_DATABASE_URL.
# Version table is alembic_version_identity (see env.py), never the regional api's alembic_version.
[alembic]
script_location = %(here)s/pitchvision_identity/db/migrations
file_template = v%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
