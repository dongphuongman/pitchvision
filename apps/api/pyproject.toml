[project]
name = "pitchvision-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pitchvision-schemas",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "redis>=5.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[tool.uv.sources]
pitchvision-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchvision_api"]
