[project]
name = "cv-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "av>=13",
  "onnxruntime>=1.19",
  "opencv-python-headless>=4.10",
  "pyarrow>=17",
  "pitchvision-schemas",
]

[tool.uv.sources]
pitchvision-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_core"]
