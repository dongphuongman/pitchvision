# PitchVision self-host / local dev stack (AD §13.1).
#
#   docker compose -f infra/compose/docker-compose.yml up -d                       # CPU-only dev
#   docker compose -f infra/compose/docker-compose.yml --profile gpu-local up -d   # + gpu-worker (RTX 4090 box)
#   docker compose -f infra/compose/docker-compose.yml --profile live up -d        # + mediamtx (M2)
#
# Needs infra/compose/.env (copy .env.example, chmod 600). See infra/compose/README.md.

name: ${COMPOSE_PROJECT_NAME:-pitchvision}

x-pv-env: &pv-env
  PV_ENV: ${PV_ENV:-local}
  # api connects as pv_app (no BYPASSRLS) so Postgres RLS applies; migrations run as the schema owner
  PV_DATABASE_URL: postgresql+asyncpg://pv_app:${PV_APP_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  PV_MIGRATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  PV_APP_DB_PASSWORD: ${PV_APP_DB_PASSWORD:?set in .env}
  PV_REDIS_URL: redis://redis:6379/0
  # Regional API JWT check (docs/contracts/identity-api.md). identity-svc publishes the JWKS.
  PV_REGION: ${PV_REGION:-eu}
  PV_JWKS_URL: ${PV_JWKS_URL:-http://identity:8000/.well-known/jwks.json}
  PV_JWT_ISSUER: ${PV_WEB_URL:-http://localhost:3000}  # must equal identity's iss
  # LOCAL ONLY: 1 = trust X-Dev-Org/X-Dev-User/X-Dev-Role headers instead of JWTs (refused unless PV_ENV=local)
  PV_DEV_AUTH: ${PV_DEV_AUTH:-0}
  # Workers write video status through the same RLS-bound role as the api (they SET app.org_id per tx).
  PV_WORKER_DATABASE_URL: postgresql+psycopg://pv_app:${PV_APP_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  # Pipeline (M1-BE-09…11). Jobs pin the image tag; workers refuse tasks built for another tag (AD §7).
  PV_IMAGE_TAG: ${TAG:-dev}
  # Queue LocalGpuBackend sends GPU stages to: `gpu` (gpu-local profile) or `cpu` on a CPU-only box (slow, same code).
  PV_LOCAL_GPU_QUEUE: ${PV_LOCAL_GPU_QUEUE:-gpu}
  PV_COMPUTE_BACKENDS: ${PV_COMPUTE_BACKENDS:-local}
  # Only this URL changes when the object store is swapped (SeaweedFS -> Garage -> R2).
  PV_STORAGE_ENDPOINT: http://storage:8333
  PV_STORAGE_PUBLIC_ENDPOINT: ${PV_STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
  PV_STORAGE_BUCKET: ${PV_STORAGE_BUCKET:?set in .env}
  PV_STORAGE_REGION: ${PV_STORAGE_REGION:-us-east-1}
  PV_STORAGE_ACCESS_KEY: ${PV_STORAGE_ACCESS_KEY:?set in .env}
  PV_STORAGE_SECRET_KEY: ${PV_STORAGE_SECRET_KEY:?set in .env}
  # boto3 default credential chain reads these.
  AWS_ACCESS_KEY_ID: ${PV_STORAGE_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${PV_STORAGE_SECRET_KEY}
  AWS_DEFAULT_REGION: ${PV_STORAGE_REGION:-us-east-1}

# identity-svc: global control plane. Self-host = its own database on the same Postgres server.
x-identity-env: &identity-env
  PV_ENV: ${PV_ENV:-local}
  PV_IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${PV_IDENTITY_DB:-pitchvision_identity}
  PV_IDENTITY_MIGRATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${PV_IDENTITY_DB:-pitchvision_identity}
  # Browser-facing origin: email links, OIDC redirect, and the JWT `iss`.
  PV_WEB_URL: ${PV_WEB_URL:-http://localhost:3000}
  PV_JWT_ISSUER: ${PV_WEB_URL:-http://localhost:3000}
  # Local: migrate-identity generates a signing key once into the identity-keys volume so sessions survive
  # restarts. Production: set PV_JWT_PRIVATE_KEY_PEM from the secret store instead.
  PV_JWT_PRIVATE_KEY_PEM: ${PV_JWT_PRIVATE_KEY_PEM:-}
  PV_JWT_PRIVATE_KEY_FILE: /keys/jwt-signing.pem
  PV_JWT_KID: ${PV_JWT_KID:-}
  PV_COOKIE_SECURE: ${PV_COOKIE_SECURE:-true}
  PV_CORS_ORIGINS: ${PV_CORS_ORIGINS:-http://localhost:5173}
  PV_EMAIL_BACKEND: ${PV_EMAIL_BACKEND:-smtp}
  PV_EMAIL_FROM: ${PV_EMAIL_FROM:-PitchVision <no-reply@pitchvision.local>}
  PV_SMTP_HOST: ${PV_SMTP_HOST:-mailpit}
  PV_SMTP_PORT: ${PV_SMTP_PORT:-1025}
  PV_RESEND_API_KEY: ${PV_RESEND_API_KEY:-}
  PV_GOOGLE_CLIENT_ID: ${PV_GOOGLE_CLIENT_ID:-}
  PV_GOOGLE_CLIENT_SECRET: ${PV_GOOGLE_CLIENT_SECRET:-}
  # behind the web nginx on the compose network: trust its X-Forwarded-For (rate limits key on client IP)
  FORWARDED_ALLOW_IPS: "*"

x-api-image: &api-image
  image: pitchvision-api:${TAG:-dev}
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.api

x-worker: &worker
  image: pitchvision-worker:${TAG:-dev}
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.worker
    args:
      BASE: ${PV_WORKER_BASE:-nvidia/cuda:12.4.1-runtime-ubuntu22.04}
  restart: unless-stopped
  # Exported ONNX weights + shot model (see models/registry.yaml; checksums are verified on load).
  volumes:
    - ${PV_MODEL_DIR:-${HOME}/.cache/pitchvision/models}:/models:ro
  # every role (orchestrator, cpu-worker, ingest-worker, gpu-worker) reads/writes tables the API's migrations
  # create: the orchestrator's startup sweep failed when it raced `migrate`
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    storage-init: { condition: service_completed_successfully }

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${PV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------ object storage
  # TODO(PO decision, SP-07): MinIO images are no longer publicly pullable. SeaweedFS
  # (Apache-2.0) is a stand-in until the PO picks SeaweedFS vs Garage; swapping it only
  # changes this service, storage-init and PV_STORAGE_ENDPOINT — app code speaks plain S3.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    configs:
      - source: seaweedfs-s3-identities
        target: /etc/seaweedfs/s3.json
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:${PV_STORAGE_PORT:-8333}:8333"
    healthcheck:
      # Unauthenticated request -> S3 XML error response means the gateway is serving.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/' "]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: create the bucket and the CORS rule browsers need for direct multipart PUTs
  # (ExposeHeaders ETag is mandatory, SP-07). Idempotent; re-run with `up storage-init`.
  storage-init:
    image: amazon/aws-cli:2.31.18
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${PV_STORAGE_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${PV_STORAGE_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${PV_STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://storage:8333
      BUCKET: ${PV_STORAGE_BUCKET:?set in .env}
      CORS_ORIGINS: ${PV_STORAGE_CORS_ORIGINS:-${PV_WEB_URL:-http://localhost:3000},http://localhost:5173}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3() { aws --endpoint-url "$$S3_ENDPOINT" s3api "$$@"; }
        if s3 head-bucket --bucket "$$BUCKET" >/dev/null 2>&1; then
          echo "bucket $$BUCKET exists"
        else
          s3 create-bucket --bucket "$$BUCKET" >/dev/null
          echo "bucket $$BUCKET created"
        fi
        origins=$$(printf '%s' "$$CORS_ORIGINS" | sed 's/[[:space:]]//g; s/,/","/g')
        s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$origins\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        s3 get-bucket-cors --bucket "$$BUCKET"
    restart: "no"

  # ------------------------------------------------------------------ api
  # One-shot: alembic upgrade head before api/workers start.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment: *pv-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api-image
    command: ["api"]
    restart: unless-stopped
    environment: *pv-env
    ports:
      - "127.0.0.1:${PV_API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ identity (AD §4, §13.1)
  # One-shot: create the identity database if missing + alembic upgrade head.
  migrate-identity:
    <<: *api-image
    command: ["migrate-identity"]
    environment: *identity-env
    volumes: [identity-keys:/keys]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  identity:
    <<: *api-image
    command: ["identity"]
    restart: unless-stopped
    environment: *identity-env
    volumes: [identity-keys:/keys:ro]
    ports:
      - "127.0.0.1:${PV_IDENTITY_PORT:-8001}:8000"
    depends_on:
      migrate-identity: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }

  # Local inbox for verification / reset / invite emails: UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PV_MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${PV_MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: pitchvision-web:${TAG:-dev}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      PV_API_UPSTREAM: api:8000
      PV_IDENTITY_UPSTREAM: identity:8000
    ports:
      - "127.0.0.1:${PV_WEB_PORT:-3000}:8080"

  # ------------------------------------------------------------------ workers (one image)
  orchestrator:
    <<: *worker
    environment:
      <<: *pv-env
      WORKER_ROLE: orchestrator

  cpu-worker:
    <<: *worker
    environment:
      <<: *pv-env
      WORKER_ROLE: cpu
      # Each process loads its own models (~1.5 GB with D-FINE + SigLIP when GPU stages run here,
      # PV_LOCAL_GPU_QUEUE=cpu). 10 processes OOM-killed an 8 GB Docker VM — keep this small.
      WORKER_CONCURRENCY: ${PV_CPU_CONCURRENCY:-2}

  # YouTube ingest (S1, M1-BE-08). Own queue `ingest` so it can move to a host with a different egress IP
  # (M1-OPS-06; SP-10: residential IP worked, datacenter IPs untested against YouTube bot-checks).
  # Success rate: `redis-cli HGETALL pv:metrics:ingest_total` (until Prometheus, OPS-08).
  ingest-worker:
    <<: *worker
    environment:
      <<: *pv-env
      WORKER_ROLE: ingest
      WORKER_CONCURRENCY: ${PV_INGEST_CONCURRENCY:-4}

  gpu-worker:
    <<: *worker
    profiles: [gpu-local]
    environment:
      <<: *pv-env
      WORKER_ROLE: gpu
      WORKER_CONCURRENCY: ${PV_GPU_CONCURRENCY:-1}  # one process per GPU (AD §4: gpu-worker = number of GPUs)
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ------------------------------------------------------------------ live (M2)
  # TODO(M2): live-worker (WORKER_ROLE=live) joins this profile when implemented.
  mediamtx:
    image: bluenviron/mediamtx:1.15.3
    profiles: [live]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"      # RTSP
      - "127.0.0.1:8889:8889"      # WebRTC (WHEP) for the browser
      - "8189:8189/udp"            # WebRTC ICE

configs:
  seaweedfs-s3-identities:
    content: |
      {"identities":[{"name":"pitchvision","credentials":[{"accessKey":"${PV_STORAGE_ACCESS_KEY:?set in .env}","secretKey":"${PV_STORAGE_SECRET_KEY:?set in .env}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  pg-data:
  identity-keys:
  redis-data:
  storage-data:
