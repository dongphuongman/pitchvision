# Staging overlay (M1-OPS-07): one VM, images from GHCR, HTTPS by Caddy, Prometheus + Alertmanager.
#
#   docker compose --env-file staging/.env -f compose/docker-compose.yml -f staging/docker-compose.staging.yml up -d
#
# Run by infra/staging/deploy.sh (see infra/staging/README.md). Without a domain the site is <ip>.sslip.io: Caddy
# still gets a real Let's Encrypt certificate. Ports 80/443 are the only public ones; everything else stays on
# 127.0.0.1 or the compose network.

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PV_SITE: ${PV_SITE:?set in staging/.env}
      PV_MAILPIT_USER: ${PV_MAILPIT_USER:-staging}
      PV_MAILPIT_HASH: ${PV_MAILPIT_HASH:?set in staging/.env (caddy hash-password)}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, storage]

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: metrics-token
        target: /etc/prometheus/metrics_token
    volumes:
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"  # ssh -L 9090:localhost:9090 to look at it

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

configs:
  caddyfile:
    content: |
      {$$PV_SITE} {
        encode zstd gzip
        reverse_proxy web:8080
      }
      # browser multipart uploads + playback media go straight to object storage (presigned URLs)
      s3.{$$PV_SITE} {
        reverse_proxy storage:8333
      }
      # verification / reset / invite emails until Resend + a domain (M1-OPS-05)
      mail.{$$PV_SITE} {
        basic_auth {
          {$$PV_MAILPIT_USER} {$$PV_MAILPIT_HASH}
        }
        reverse_proxy mailpit:8025
      }
  prometheus:
    content: |
      global:
        scrape_interval: 30s
        external_labels: {env: staging, region: ${PV_REGION:-eu}}
      rule_files: [/etc/prometheus/alerts.yml]
      alerting:
        alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
      scrape_configs:
        - job_name: api
          metrics_path: /metrics
          authorization: {credentials_file: /etc/prometheus/metrics_token}
          static_configs: [{targets: ["api:8000"]}]
        - job_name: prometheus
          static_configs: [{targets: ["localhost:9090"]}]
  metrics-token:
    content: ${PV_METRICS_TOKEN:?set in staging/.env}
  alertmanager:
    content: |
      route:
        receiver: chat
        group_by: [alertname]
        group_wait: 30s
        repeat_interval: 4h
      receivers:
        - name: chat
          slack_configs:
            # a Slack incoming webhook, or a Discord webhook URL + "/slack"
            - api_url: "${PV_ALERT_WEBHOOK_URL:?set in staging/.env}"
              send_resolved: true
              title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [staging] {{ .CommonLabels.alertname }}'
              text: '{{ range .Alerts }}• {{ .Annotations.summary }} {{ end }}'

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
