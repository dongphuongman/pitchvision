[project]
name = "pitchvision-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pitchvision-schemas",
  "cv-core",
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "yt-dlp==2026.8.19",
  # ingest worker writes video status itself (RLS-bound role, see pitchvision_worker/repository.py)
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  # notification emails go through identity-svc's internal endpoint
  "httpx>=0.27",
  "sentry-sdk[celery]>=2.20",
]

[tool.uv.sources]
pitchvision-schemas = { workspace = true }
cv-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchvision_worker"]
