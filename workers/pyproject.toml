[project]
name = "pitchvision-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pitchvision-schemas",
  "cv-core",
  "celery[redis]>=5.4",
  "boto3>=1.35",
]

[tool.uv.sources]
pitchvision-schemas = { workspace = true }
cv-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchvision_worker"]
